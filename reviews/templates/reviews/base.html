{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}IdeaFlow Review{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'reviews/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'home' %}">IdeaFlow <span>Reference Review</span></a>
    <div class="local-badge">Local only</div>
  </header>
  <main class="page-shell">
    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
